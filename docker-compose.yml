version: '3.8'

services:
  web:
    container_name: econstructionsite-web
    build: .
    ports:
      - "9090:80"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    container_name: econstructionsite-db
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "54321:5432"
    volumes:
      - pgdata_const:/var/lib/postgresql/data
      - ./DATABASE FILE/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: econstructionsite-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecom.com
      PGADMIN_DEFAULT_PASSWORD: password123
    ports:
      - "5051:80"
    depends_on:
      - db

volumes:
  pgdata_const:
