version: '3.8'

services:
  web:
    container_name: econstructionsite-web
    build: .
    ports:
      - "9090:80"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.econstructionsite.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.econstructionsite.entrypoints=websecure"
      - "traefik.http.routers.econstructionsite.tls=true"
      - "traefik.http.routers.econstructionsite.tls.certresolver=myresolver"
      - "traefik.http.services.econstructionsite.loadbalancer.server.port=80"

  db:
    container_name: econstructionsite-db
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "54321:5432"
    volumes:
      - pgdata_const:/var/lib/postgresql/data
      - ./DATABASE FILE/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - default

networks:
  default:
  traefik-net:
    external: true

volumes:
  pgdata_const:
