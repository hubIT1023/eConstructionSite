version: '3.8'

services:
  web:
    container_name: econstructionsite-web
    build: .
    ports:
      - "9090:80"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    container_name: econstructionsite-db
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "54321:5432"
    volumes:
      - pgdata_const:/var/lib/postgresql/data
      - ./DATABASE FILE/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: econstructionsite-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      - db

  erp:
    container_name: econstructionsite-erp
    image: node:20-alpine
    restart: always
    working_dir: /app/erp
    volumes:
      - .:/app
      - ${SSL_CERTS_DIR:-./ssl}:/etc/letsencrypt:ro
    ports:
      - "4000:4000"
    environment:
      - PORT=${ERP_PORT:-4000}
      - DB_HOST=${ERP_DB_HOST:-db}
      - DB_PORT=${ERP_DB_PORT:-5432}
      - DB_NAME=${ERP_DB_NAME:-ecomDB}
      - DB_USER=${ERP_DB_USER:-erp_service_user}
      - DB_PASS=${ERP_DB_PASS:-erp_local_secret}
    command: sh -c "npm install && node server.js"
    depends_on:
      - db

volumes:
  pgdata_const:
